services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      # passed through from your shell/.env only when set (see app/config.py)
      OPENAI_API_KEY:
      OPENAI_MODEL:
    volumes:
      - ./backend:/app
      - db-data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
